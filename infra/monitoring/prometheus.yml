global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: chatify-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]

  - job_name: chatify-signaling
    metrics_path: /metrics
    static_configs:
      - targets: [signaling:3001]

  - job_name: chatify-media
    metrics_path: /metrics
    static_configs:
      - targets: [media-worker:3002]

  - job_name: chatify-outbox
    metrics_path: /metrics
    static_configs:
      - targets: [outbox-publisher:8083]
