name: ${COMPOSE_PROJECT_NAME:-chatify-realtime-local}

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${WEB_API_URL:-http://localhost:8080}
        VITE_SIGNALING_URL: ${WEB_SIGNALING_URL:-http://localhost:3001}
        VITE_MEDIA_URL: ${WEB_MEDIA_URL:-http://localhost:3002}
    restart: unless-stopped
    environment:
      CHATIFY_CONNECT_SRC: ${WEB_CSP_CONNECT_SRC:-http://localhost:8080 http://localhost:3001 ws://localhost:3001 http://localhost:3002}
    depends_on:
      api:
        condition: service_healthy
      signaling:
        condition: service_started
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chatify-realtime-net

  signaling:
    build:
      context: ../..
      dockerfile: apps/signaling/Dockerfile
    restart: unless-stopped
    environment:
      SIGNALING_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-local}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      API_BASE_URL: http://api:8080
      REDIS_ADDRESS: ${REDIS_ADDRESS:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDPANDA_ADDRESS: redpanda:9092
      OUTBOX_TOPIC: room-events
      SIGNAL_RATE_LIMIT_MAX: ${SIGNAL_RATE_LIMIT_MAX:-240}
    depends_on:
      api:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chatify-realtime-net

  media-worker:
    build:
      context: ../..
      dockerfile: apps/media/Dockerfile
    restart: unless-stopped
    environment:
      MEDIA_HTTP_PORT: 3002
      MEDIA_CORS_ORIGIN: ${MEDIA_CORS_ORIGIN:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-local}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      API_BASE_URL: http://api:8080
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 40020
      RTC_ANNOUNCED_ADDRESS: ${RTC_ANNOUNCED_ADDRESS:-127.0.0.1}
      RTC_STUN_URL: ${RTC_STUN_URL:-stun:127.0.0.1:3478}
      RTC_TURN_URL: ${RTC_TURN_URL:-turn:127.0.0.1:3478?transport=udp}
      RTC_TURN_USERNAME: ${RTC_TURN_USERNAME:-chatify}
      RTC_TURN_CREDENTIAL: ${RTC_TURN_CREDENTIAL:-}
      MEDIA_TRANSPORT_IDLE_TIMEOUT_MS: ${MEDIA_TRANSPORT_IDLE_TIMEOUT_MS:-60000}
    depends_on:
      coturn:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:40000-40020:40000-40020/udp"
      - "127.0.0.1:40000-40020:40000-40020/tcp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chatify-realtime-net

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: build
    command: ["/out/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatify-realtime-net

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      POSTGRES_ADDRESS: postgres:5432
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDPANDA_ADDRESS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-300}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-1048576}
      OBJECT_STORAGE_ENDPOINT: object-storage:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatify-realtime-net

  outbox-publisher:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/chatify-outbox-publisher"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDPANDA_ADDRESS: redpanda:9092
      OUTBOX_TOPIC: room-events
      OUTBOX_METRICS_PORT: 8083
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chatify-realtime-net

  attachment-cleanup:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/chatify-attachment-cleanup"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      OBJECT_STORAGE_ENDPOINT: object-storage:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
      ATTACHMENT_PENDING_RETENTION: ${ATTACHMENT_PENDING_RETENTION:-24h}
      ATTACHMENT_CLEANUP_INTERVAL: ${ATTACHMENT_CLEANUP_INTERVAL:-15m}
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    networks:
      - chatify-realtime-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chatify-realtime-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chatify-realtime-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - chatify-realtime-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chatify-realtime-net

  redpanda:
    image: redpandadata/redpanda:v26.2.5
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:18082:18082"
    volumes:
      - chatify-realtime-redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - chatify-realtime-net

  redpanda-console:
    image: redpandadata/console:v3.13.1
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - chatify-realtime-net

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - chatify-realtime-prometheus:/prometheus
    networks:
      - chatify-realtime-net

  object-storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - chatify-realtime-object-storage:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - chatify-realtime-net

  coturn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --realm=${TURN_REALM}
      - --user=chatify:${TURN_SECRET}
      - --fingerprint
      - --min-port=49160
      - --max-port=49200
    ports:
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:49160-49200:49160-49200/udp"
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chatify-realtime-net

networks:
  chatify-realtime-net:
    name: chatify-realtime-local-net
    driver: bridge

volumes:
  chatify-realtime-postgres:
    name: chatify-realtime-postgres
  chatify-realtime-redis:
    name: chatify-realtime-redis
  chatify-realtime-redpanda:
    name: chatify-realtime-redpanda
  chatify-realtime-object-storage:
    name: chatify-realtime-object-storage
  chatify-realtime-prometheus:
    name: chatify-realtime-prometheus
